<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahibzada Umer Siraj Wallet v14</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            padding: 10px;
            margin: 0;
            min-height: 100vh;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #0f172a;
            box-sizing: border-box;
            overflow-x: hidden;
        }
        
        /* 🖼️ بیک گراؤنڈ تصاویر */
        body.dashboard-bg { background: url('pic2.jpg'); }

        /* 🌈 نام دائیں سے بائیں متحرک ہونے والی اینیمیشن */
        .header-container {
            width: 100%;
            overflow: hidden;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .vip-header {
            font-family: 'Impact', 'Arial Black', sans-serif;
            font-size: 24px; 
            font-weight: bold;
            display: inline-block;
            white-space: nowrap;
            background: linear-gradient(45deg, #ffd700, #ff007f, #00f2fe, #4facfe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorAnimation 6s ease infinite, moveName 12s linear infinite;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.9), 0 0 10px rgba(0, 242, 254, 0.4);
            padding-right: 100%;
        }

        @keyframes moveName {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        @keyframes colorAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 🔒 والٹ کنٹینر پوزیشن */
        .container {
            width: 90%;
            max-width: 270px; 
            margin-right: auto; 
            margin-left: auto;
            margin-top: 260px; 
            box-sizing: border-box;
        }

        /* شیشہ نما کارڈز */
        .glass-button-card {
            background: transparent; 
            border: none; 
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
            box-sizing: border-box;
            width: 100%;
        }

        .edit-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }

        /* ⚡ جاز کیش اور ایزی پیسہ بٹنز */
        .apps-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .app-btn {
            flex: 1;
            padding: 12px 5px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .jazzcash { background: linear-gradient(135deg, #111111, #ffcc00); color: #ffffff; border: 1px solid #ffcc00; }
        .easypaisa { background: linear-gradient(135deg, #00a651, #00713d); }
        
        .balance-text-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
        }

        .eye-btn {
            cursor: pointer;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 6px;
            user-select: none;
        }

        .notes-title {
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #ffd700;
        }

        .notes-area {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 13px;
            outline: none;
        }

        /* 🤖 AI چیٹ بوٹ کا اسٹائل */
        .ai-widget {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 10000;
        }

        .ai-icon-btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            width: 55px;
            height: 55px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        .ai-chat-window {
            display: none;
            position: fixed;
            bottom: 85px;
            left: 20px;
            width: 280px;
            height: 350px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            flex-direction: column;
            overflow: hidden;
            z-index: 10000;
        }

        .ai-header {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: black;
            padding: 12px;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ai-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg {
            padding: 8px 12px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.4;
        }
        .msg.bot { background: rgba(255,255,255,0.1); align-self: flex-start; text-align: left; }
        .msg.user { background: #4facfe; color: black; align-self: flex-end; text-align: right; }

        .ai-input-area {
            display: flex;
            padding: 8px;
            background: rgba(0,0,0,0.5);
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .ai-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            padding: 6px;
            outline: none;
            font-size: 13px;
        }

        .ai-send-btn {
            background: #4facfe;
            border: none;
            color: black;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
    </style>
</head>
<body class="dashboard-bg"> <!-- ڈائریکٹ ڈیش بورڈ امیج لوڈ ہوگی -->

<div class="header-container">
    <div class="vip-header">Sahibzada Umer Siraj</div>
</div>

<div class="container">
    <!-- 2. مین ڈیش بورڈ (اب یہ پہلے ہی صفحے پر ڈائریکٹ اوپن ہوگا) -->
    <div id="dashboard" style="display: block;">
        <div class="glass-button-card">
            <div class="balance-text-group">
                <div style="font-size: 13px; opacity: 0.9;">کل بیلنس (PKR):</div>
                <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            </div>
            <div id="balance-val" class="balance-amount">Rs. 0</div>
            <button class="edit-btn" onclick="editBalance()">رقم تبدیل کریں ✏️</button>
        </div>

        <div class="apps-row">
            <a href="jazzcash://" class="app-btn jazzcash">JazzCash</a>
            <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa</a>
        </div> 

        <div class="glass-button-card">
            <div class="notes-title">📝 میرے خفیہ نوٹس:</div>
            <textarea id="wallet-notes" class="notes-area" placeholder="کارڈ نمبرز یا کوڈز یہاں لکھیں..." oninput="saveNotes()"></textarea>
        </div>
    </div>
</div>

<!-- 🤖 AI روبوٹ اسسٹنٹ ہوم پیج پر ریڈی ہے -->
<div class="ai-widget" id="ai-widget" style="display: block;">
    <div class="ai-icon-btn" onclick="toggleAiChat()">🤖</div>
    <div class="ai-chat-window" id="ai-window">
        <div class="ai-header">
            <span>Umer Wallet AI Assistant 🤖</span>
            <span style="cursor:pointer; font-size:18px;" onclick="toggleAiChat()">×</span>
        </div>
        <div class="ai-messages" id="ai-messages">
            <div class="msg bot">سلام صاحبزادہ عمر سراج! میں آپ کا اسسٹنٹ ہوں۔ آپ مجھ سے اپنے والٹ بجٹ کے بارے میں کچھ بھی پوچھ سکتے ہیں۔</div>
        </div>
        <div class="ai-input-area">
            <input type="text" id="ai-text" class="ai-input" placeholder="یہاں لکھیں...">
            <button class="ai-send-btn" onclick="sendAiMessage()">بھیجیں</button>
        </div>
    </div>
</div>

<script>
    var isBalanceHidden = false;

    // پیج لوڈ ہوتے ہی ڈیٹا ریکور کریں
    window.onload = function() {
