<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahibzada Umer Siraj Wallet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #0f172a;
            box-sizing: border-box;
        }
        
        /* 🖼️ بیک گراؤنڈ تصاویر */
        body.login-bg { background: url('pic1.jpg'); }
        body.dashboard-bg { background: url('pic2.jpg'); }

        /* 🌈 ملٹی کلر پریمیم ہیڈر */
        .vip-header {
            font-family: 'Montserrat', Arial, sans-serif;
            font-size: 26px;
            font-weight: 900;
            margin: 15px 0 20px 0;
            text-align: right;
            max-width: 280px; /* سائز چھوٹا کر کے رائٹ سائیڈ پر فکس کیا */
            margin-right: 10px;
            margin-left: auto;
            /* ملٹی کلر گریڈینٹ */
            background: linear-gradient(45deg, #ff007f, #ffd700, #00f2fe, #4facfe);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorAnimation 6s ease infinite;
            text-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        @keyframes colorAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* پورے کنٹینر کو دائیں طرف ایک چھوٹی پٹی کی شکل دے دی ہے */
        .container {
            max-width: 280px; /* ڈبوں کی چوڑائی مزید چھوٹی کر دی */
            margin-right: 10px; /* دائیں طرف ایڈجسٹمنٹ */
            margin-left: auto;
            box-sizing: border-box;
        }

        /* بالکل صاف اور پتلے شیشہ نما کارڈز */
        .glass-button-card {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
            margin-bottom: 12px;
            text-align: center;
        }

        /* لاگ ان کے ڈبوں کو تھوڑا نیچے کرنے کے لیے مارجن */
        .login-margin-box {
            margin-top: 40px;
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            color: #ffffff;
            outline: none;
        }
        .input-field::placeholder { color: #cbd5e1; }

        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .app-btn {
            display: block;
            padding: 14px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 12px;
            text-align: center;
        }

        .jazzcash { background: linear-gradient(135deg, #111111, #ffcc00); color: #ffffff; border: 1px solid #ffcc00; }
        .easypaisa { background: linear-gradient(135deg, #00a651, #00713d); }
        
        .balance-text-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
        }

        .eye-btn {
            cursor: pointer;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 6px;
            user-select: none;
        }

        .edit-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }

        .notes-title {
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #ffd700;
        }

        .notes-area {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 13px;
            outline: none;
        }

        #backup-login, #dashboard { display: none; }
    </style>
</head>
<body class="login-bg">

<div class="container">
    <!-- ملٹی کلر نام دائیں طرف فکس -->
    <div class="vip-header">Sahibzada Umer Siraj</div>

    <!-- 1. لاگ ان اسکرین (چھوٹی پٹی اور نیچے ایڈجسٹ) -->
    <div id="backup-login" class="glass-button-card login-margin-box">
        <div style="font-size: 30px; margin-bottom: 8px;">🔒</div>
        <p style="color: #e2e8f0; font-size: 13px; margin-bottom: 12px;">والٹ انلاک کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="پن کوڈ درج کریں" maxlength="4">
        <button class="btn" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 2. مین ڈیش بورڈ (دائیں طرف فکسڈ پٹیاں) -->
    <div id="dashboard">
        
        <!-- بیلنس کارڈ -->
        <div class="glass-button-card">
            <div class="balance-text-group">
                <div style="font-size: 13px; opacity: 0.9;">کل بیلنس (PKR):</div>
                <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            </div>
            <div id="balance-val" class="balance-amount">Rs. 0</div>
            <button class="edit-btn" onclick="editBalance()">رقم تبدیل کریں ✏️</button>
        </div>

        <!-- ایپس کے بٹنز -->
        <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
        <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>

        <!-- خفیہ نوٹس کارڈ -->
        <div class="glass-button-card">
            <div class="notes-title">📝 میرے خفیہ نوٹس:</div>
            <textarea id="wallet-notes" class="notes-area" placeholder="کارڈ نمبرز یا کوڈز یہاں لکھیں..." oninput="saveNotes()"></textarea>
        </div>
        
    </div>
</div>

<script>
    var CORRECT_USER = "UmerSiraj";
    var CORRECT_PIN = "1122";
    var isBalanceHidden = false;

    window.onload = function() {
        document.getElementById('backup-login').style.display = 'block';

        var savedBalance = localStorage.getItem('wallet_balance');
        if (savedBalance) {
            document.getElementById('balance-val').innerText = "Rs. " + savedBalance;
        }

        if (localStorage.getItem('wallet_notes')) {
            document.getElementById('wallet-notes').value = localStorage.getItem('wallet_notes');
        }
    };

    function verifyBackupLogin() {
        var enteredUser = document.getElementById('login-user').value.trim();
        var enteredPin = document.getElementById('login-pin').value.trim();

        if (enteredUser === CORRECT_USER && enteredPin === CORRECT_PIN) {
            showDashboard();
        } else {
            alert("❌ غلط یوزر نیم یا پن کوڈ!");
        }
    }

    function toggleBalance() {
        var balElement = document.getElementById('balance-val');
        var currentSaved = localStorage.getItem('wallet_balance') || "0";
        
        if (isBalanceHidden) {
            balElement.innerText = "Rs. " + currentSaved;
            isBalanceHidden = false;
        } else {
            balElement.innerText = "******";
            isBalanceHidden = true;
        }
    }

    function editBalance() {
        var newBal = prompt("نیا بیلنس درج کریں (صرف ہندسے):");
        if (newBal !== null && newBal.trim() !== "" && !isNaN(newBal)) {
            localStorage.setItem('wallet_balance', newBal);
            document.getElementById('balance-val').innerText = "Rs. " + newBal;
            isBalanceHidden = false;
        }
    }

    function saveNotes() {
        localStorage.setItem('wallet_notes', document.getElementById('wallet-notes').value);
    }

    // ڈیش بورڈ کھلتے ہی بیک گراؤنڈ کلاس تبدیل کریں
    function showDashboard() {
        document.getElementById('backup-login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        document.body.className = "dashboard-bg";
    }
</script>

</body>
</html>
