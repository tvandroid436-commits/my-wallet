<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میرا والٹ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .app-btn {
            display: block;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .jazzcash { background: #000000; color: #ffcc00; border: 1px solid #ffcc00; }
        .easypaisa { background: #00a651; }
        
        /* شروعات میں سب کچھ نظر آئے گا، صرف ڈیش بورڈ چھپا ہوگا */
        #dashboard, #backup-login { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- سیٹ اپ اسکرین -->
    <div id="setup-screen">
        <h2>والٹ سیٹ اپ کریں</h2>
        <p>پہلی بار لاگ ان کے لیے یوزر نیم اور پن کوڈ بنائیں۔</p>
        <input type="text" id="setup-user" class="input-field" placeholder="یوزر نیم لکھیں">
        <input type="password" id="setup-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="saveSetup()">سیکیورٹی لاک سیٹ کریں</button>
    </div>

    <!-- لاگ ان اسکرین -->
    <div id="backup-login">
        <h2>والٹ لاگ ان</h2>
        <p>براہ کرم اپنا یوزر نیم اور پن کوڈ درج کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="verifyLogin()">لاگ ان کریں</button>
    </div>

    <!-- مین ڈیش بورڈ -->
    <div id="dashboard">
        <h2>خوش آمدید!</h2>
        <div style="background: #764ba2; color:white; padding:15px; border-radius:10px; margin-bottom:20px;">
            <h3>Rs. 50,000</h3>
        </div>
        <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
        <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>
    </div>

</div>

<script>
    // جیسے ہی پیج لوڈ ہو، چیک کریں کہ پہلے سے ڈیٹا موجود ہے یا نہیں
    window.onload = function() {
        var user = localStorage.getItem('w_user');
        var pin = localStorage.getItem('w_pin');

        if (user && pin) {
            // اگر ڈیٹا پہلے سے سیٹ ہے، تو سیٹ اپ چھپا کر لاگ ان دکھائیں
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('backup-login').style.display = 'block';
        }
    };

    function saveSetup() {
        var u = document.getElementById('setup-user').value.trim();
        var p = document.getElementById('setup-pin').value.trim();

        if (u === "" || p.length !== 4) {
            alert("درست یوزر نیم اور 4 ہندسوں کا پن لکھیں!");
            return;
        }

        localStorage.setItem('w_user', u);
        localStorage.setItem('w_pin', p);
        alert("سیکیورٹی لاک سیٹ ہو گیا!");
        window.location.reload();
    }

    function verifyLogin() {
        var u = document.getElementById('login-user').value.trim();
        var p = document.getElementById('login-pin').value.trim();

        if (u === localStorage.getItem('w_user') && p === localStorage.getItem('w_pin')) {
            document.getElementById('backup-login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
        } else {
            alert("غلط معلومات!");
        }
    }
</script>

</body>
</html>
