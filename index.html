<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عمر سراج والٹ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            color: #2c3e50;
            padding: 20px;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #f5f7fa; /* اگر امیج لوڈ نہ ہو تو یہ رنگ دکھے گا */
        }
        
        /* 🖼️ پہلے پیج کا درست تصویر لنک */
        body.login-bg {
            background: url('https://ibb.co');
        }

        /* 🖼️ دوسرے پیج کا درست تصویر لنک */
        body.dashboard-bg {
            background: url('https://ibb.co');
        }

        .container {
            max-width: 400px;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .input-field {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
            background: white;
            outline: none;
        }

        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        .app-btn {
            display: block;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .jazzcash { background: #000000; color: #ffcc00; border: 1px solid #ffcc00; }
        .easypaisa { background: #00a651; }
        
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 22px;
            border-radius: 18px;
            margin-bottom: 20px;
            text-align: right;
            position: relative;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }

        .eye-btn {
            position: absolute;
            left: 20px;
            top: 22px;
            cursor: pointer;
            font-size: 22px;
            background: rgba(255,255,255,0.25);
            padding: 5px 10px;
            border-radius: 50px;
            line-height: 1;
        }

        .edit-btn {
            background: rgba(255,255,255,0.25);
            border: none;
            color: white;
            padding: 5px 12px;
            font-size: 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
        }

        .notes-section {
            margin-top: 25px;
            text-align: right;
        }

        .notes-area {
            width: 100%;
            height: 90px;
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
            margin-top: 5px;
        }

        #lock-screen, #backup-login, #dashboard { display: none; }
    </style>
</head>
<body class="login-bg"> <!-- یہاں پہلا امیج لوڈ ہوگا -->

<div class="container">

    <!-- 1. فنگر پرنٹ لاک اسکرین -->
    <div id="lock-screen">
        <div style="font-size: 70px; margin-bottom: 15px;">🛡️</div>
        <h2>میرا محفوظ والٹ</h2>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">والٹ کھولنے کے لیے نیچے بٹن دبا کر اپنا فنگر پرنٹ لگائیں۔</p>
        <button class="btn" onclick="authenticateUser()">فنگر پرنٹ سے انلاک کریں</button>
    </div>

    <!-- 2. لاگ ان اسکرین (یوزر نیم اور پاس ورڈ) -->
    <div id="backup-login">
        <div style="font-size: 60px; margin-bottom: 15px;">🔒</div>
        <h2>والٹ لاگ ان</h2>
        <p style="color: #7f8c8d; font-size: 14px; margin-bottom: 25px;">براہ کرم اپنا مخصوص یوزر نیم اور پن کوڈ درج کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 3. مین ڈیش بورڈ -->
    <div id="dashboard">
        <div class="balance-card">
            <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            <div style="font-size: 12px; opacity: 0.85;">میرا کل بیلنس (PKR)</div>
            <div id="balance-val" class="balance-amount">Rs. 0</div>
            <button class="edit-btn" onclick="editBalance()">رقم تبدیل کریں ✏️</button>
        </div>

        <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
        <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>

        <div class="notes-section">
            <label style="font-size: 14px; font-weight: bold;">📝 میرے خفیہ نوٹس / اکاؤنٹس:</label>
            <textarea id="wallet-notes" class="notes-area" placeholder="اپنے ضروری کارڈ نمبرز یا کوڈز یہاں لکھیں..." oninput="saveNotes()"></textarea>
        </div>
    </div>

</div>

<script>
    // یوزر نیم اور پاس ورڈ فکسڈ ڈیٹا
    var CORRECT_USER = "UmerSiraj";
    var CORRECT_PIN = "1122";
    var isBalanceHidden = false;

    window.onload = function() {
        // لاگ ان اسکرین دکھائیں
        document.getElementById('backup-login').style.display = 'block';

        // محفوظ بیلنس لوڈ کریں
        var savedBalance = localStorage.getItem('wallet_balance');
        if (savedBalance) {
            document.getElementById('balance-val').innerText = "Rs. " + savedBalance;
        }

        // محفوظ نوٹس لوڈ کریں
        if (localStorage.getItem('wallet_notes')) {
            document.getElementById('wallet-notes').value = localStorage.getItem('wallet_notes');
        }
    };

    function verifyBackupLogin() {
        var enteredUser = document.getElementById('login-user').value.trim();
        var enteredPin = document.getElementById('login-pin').value.trim();

        if (enteredUser === CORRECT_USER && enteredPin === CORRECT_PIN) {
            if (window.PublicKeyCredential) {
                document.getElementById('backup-login').style.display = 'none';
                document.getElementById('lock-screen').style.display = 'block';
                authenticateUser();
            } else {
                showDashboard();
            }
        } else {
            alert("❌ غلط یوزر نیم یا پن کوڈ! دوبارہ کوشش کریں۔");
        }
    }

    function authenticateUser() {
        navigator.credentials.create({
            publicKey: {
                challenge: new Uint8Array(),
                rp: { name: "Wallet" },
                user: { id: new Uint8Array(), name: CORRECT_USER, displayName: CORRECT_USER },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                timeout: 60000,
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
            }
        }).then(function(credential) {
            if (credential) { showDashboard(); }
        }).catch(function(err) {
            alert("🔒 بائیومیٹرک تصدیق نہیں ہو سکی۔");
            window.location.reload();
        });
    }

    function toggleBalance() {
        var balElement = document.getElementById('balance-val');
        var currentSaved = localStorage.getItem('wallet_balance') || "0";
        
        if (isBalanceHidden) {
            balElement.innerText = "Rs. " + currentSaved;
            isBalanceHidden = false;
        } else {
            balElement.innerText = "******";
            isBalanceHidden = true;
        }
    }

    function editBalance() {
        var newBal = prompt("نیا بیلنس درج کریں (صھرف ہندسے):");
        if (newBal !== null && newBal.trim() !== "" && !isNaN(newBal)) {
            localStorage.setItem('wallet_balance', newBal);
            document.getElementById('balance-val').innerText = "Rs. " + newBal;
            isBalanceHidden = false;
        }
    }

    function saveNotes() {
        localStorage.setItem('wallet_notes', document.getElementById('wallet-notes').value);
    }

    function showDashboard() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('backup-login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        // باڈی کلاس تبدیل کر کے دوسری تصویر لگائیں
        document.body.className = "dashboard-bg";
    }
</script>

</body>
</html>
