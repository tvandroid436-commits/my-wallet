<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میرا والٹ - الٹرا پرو ڈیش بورڈ</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: rgba(255, 255, 255, 0.9);
            --text-main: #2c3e50;
            --text-sub: #7f8c8d;
            --border-color: rgba(0, 0, 0, 0.05);
            --shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        .dark-theme {
            --bg-gradient: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            --card-bg: rgba(30, 41, 59, 0.85);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: all 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 30px;
            text-align: center;
            transition: transform 0.3s ease, background 0.5s ease;
        }

        h1 {
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .status-msg {
            color: var(--text-sub);
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Inputs & Buttons */
        .input-field {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            background: rgba(255,255,255,0.1);
            color: var(--text-main);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 16px;
            text-align: center;
            outline: none;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .input-field::placeholder {
            color: var(--text-sub);
        }

        .btn-auth {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
            transition: all 0.3s ease;
        }

        .btn-auth:active {
            transform: scale(0.97);
        }

        /* Dashboard Items */
        #setup-screen, #lock-screen, #backup-login, #dashboard {
            display: none;
        }

        /* Modern Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 18px;
            margin-bottom: 25px;
            text-align: right;
            position: relative;
            box-shadow: 0 8px 20px rgba(118, 75, 162, 0.3);
        }

        .balance-title {
            font-size: 12px;
            opacity: 0.8;
        }

        .balance-amount {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }

        .eye-btn {
            position: absolute;
            left: 20px;
            top: 25px;
            cursor: pointer;
            font-size: 20px;
        }

        /* App Buttons */
        .app-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .app-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }

        .app-btn:active {
            transform: scale(0.98);
        }

        .jazzcash { background: linear-gradient(135deg, #111111, #ffcc00); color: #fff; }
        .easypaisa { background: linear-gradient(135deg, #00a651, #00713d); }

        /* Notes Section */
        .notes-section {
            margin-top: 25px;
            text-align: right;
        }

        .notes-section label {
            font-size: 14px;
            font-weight: bold;
            display: block;
            margin-bottom: 8px;
        }

        .notes-area {
            width: 100%;
            height: 80px;
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 12px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            outline: none;
        }

        /* Theme Toggle Top Right */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            cursor: pointer;
            font-size: 24px;
            z-index: 10;
        }
    </style>
</head>
<body>

<!-- تھیم بدلنے کا بٹن -->
<div class="theme-toggle" onclick="toggleTheme()">🌙</div>

<div class="container">
    <!-- 1. سیٹ اپ اسکرین -->
    <div id="setup-screen" class="card">
        <div style="font-size: 50px; margin-bottom: 10px;">⚙️</div>
        <h1>والٹ سیٹ اپ کریں</h1>
        <p class="status-msg">پہلی بار لاگ ان کے لیے معلومات درج کریں۔</p>
        <input type="text" id="setup-user" class="input-field" placeholder="اپنا یوزر نیم لکھیں">
        <input type="password" id="setup-pin" class="input-field" pattern="[0-9]*" inputmode="numeric" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn-auth" onclick="saveSetup()">سیکیورٹی لاک سیٹ کریں</button>
    </div>

    <!-- 2. فنگر پرنٹ لاک اسکرین -->
    <div id="lock-screen" class="card">
        <div style="font-size: 70px; margin-bottom: 15px; cursor:pointer;" onclick="authenticateUser()">🛡️</div>
        <h1>میرا محفوظ والٹ</h1>
        <p class="status-msg">ڈیش بورڈ کھولنے کے لیے نیچے بٹن پر کلک کریں اور اپنا فنگر پرنٹ اسکین کریں۔</p>
        <button class="btn-auth" onclick="authenticateUser()">والٹ انلاک کریں</button>
    </div>

    <!-- 3. بیک اپ لاگ ان اسکرین -->
    <div id="backup-login" class="card">
        <div style="font-size: 60px; margin-bottom: 15px;">🔒</div>
        <h1>والٹ لاگ ان</h1>
        <p class="status-msg">براہ کرم اپنا یوزر نیم اور پن کوڈ درج کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" pattern="[0-9]*" inputmode="numeric" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn-auth" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 4. والٹ ڈیش بورڈ (مین ایپ) -->
    <div id="dashboard" class="card">
        <!-- لائیو بیلنس کارڈ -->
        <div class="balance-card">
            <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            <div class="balance-title">میرا اندازاً بیلنس (PKR)</div>
            <div id="balance-val" class="balance-amount">Rs. 50,000</div>
        </div>

        <div class="app-buttons">
            <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
            <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>
        </div>

        <!-- خفیہ نوٹس اور اکاؤنٹس لکھنے کی جگہ -->
        <div class="notes-section">
            <label>📝 میرے خفیہ نوٹس / اکاؤنٹ نمبر:</label>
            <textarea id="wallet-notes" class="notes-area" placeholder="اپنے ضروری اکاؤنٹ نمبر یا کوڈز یہاں لکھیں، یہ خود بخود محفوظ ہو جائیں گے..." oninput="saveNotes()"></textarea>
        </div>
    </div>
</div>

<script>
    var isBalanceHidden = false;

    window.onload = function() {
        // تھیم لوڈ کریں
        if(localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-theme');
            document.querySelector('.theme-toggle').innerText = "☀️";
        }

        var savedUser = localStorage.getItem('wallet_user');
        var savedPin = localStorage.getItem('wallet_pin');

        if (!savedUser || !savedPin) {
            document.getElementById('setup-screen').style.display = 'block';
        } else {
            if (window.PublicKeyCredential) {
                document.getElementById('lock-screen').style.display = 'block';
                authenticateUser();
            } else {
                document.getElementById('backup-login').style.display = 'block';
            }
        }

        // نوٹس لوڈ کریں
        if(localStorage.getItem('wallet_notes')) {
            document.getElementById('wallet-notes').value = localStorage.getItem('wallet_notes');
        }
    };

    // ڈارک تھیم ٹوگل
    function toggleTheme() {
        document.body.classList.toggle('dark-theme');
        if(document.body.classList.contains('dark-theme')) {
            localStorage.setItem('theme', 'dark');
            document.querySelector('.theme-toggle').innerText = "☀️";
        } else {
            localStorage.setItem('theme', 'light');
            document.querySelector('.theme-toggle').innerText = "🌙";
        }
    }

    // بیلنس چھپانے اور دکھانے کا فنکشن
    function toggleBalance() {
