<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sahibzada Umer Siraj Wallet v14</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #0f172a;
            box-sizing: border-box;
        }
        
        /* 🖼️ بیک گراؤنڈ تصاویر */
        body.login-bg { background: url('pic1.jpg'); }
        body.dashboard-bg { background: url('pic2.jpg'); }

        /* 🌈 نیا اسٹائلش ہیڈر جو بائیں (Left) طرف شفٹ ہے */
        .vip-header {
            font-family: 'Courier New', Courier, monospace; /* فیوچرسٹک لک کے لیے اسٹائل چینج */
            font-size: 22px; 
            font-weight: 900;
            margin: 15px 0 20px 0;
            text-align: left; /* ٹیکسٹ کو لیفٹ الائن کیا */
            max-width: 280px;
            margin-left: 15px; /* بائیں طرف تھوڑا فاصلہ */
            margin-right: auto;
            letter-spacing: 1px;
            background: linear-gradient(45deg, #00f2fe, #4facfe, #ffd700, #ff007f);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorAnimation 6s ease infinite;
            text-shadow: 0 2px 10px rgba(0,242,254,0.4);
        }

        @keyframes colorAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* پورے والٹ کا دائیں طرف کا کنٹینر */
        .container {
            max-width: 250px; 
            margin-right: 5px; 
            margin-left: auto;
            box-sizing: border-box;
        }

        /* شیشہ نما کارڈز */
        .glass-button-card {
            background: rgba(0, 0, 0, 0.65); /* تھوڑا زیادہ ڈارک کیا تاکہ ٹیکسٹ صاف دکھے */
            border: 1px solid rgba(0, 242, 254, 0.25); /* ہلکا نیلا بارڈر فیوچرسٹک لک کے لیے */
            border-radius: 14px;
            padding: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
            margin-bottom: 12px;
            text-align: center;
            box-sizing: border-box;
        }

        /* 🔒 لاگ ان کے ڈبوں کو نیچے کرنے کا مارجن */
        .login-margin-box {
            margin-top: 140px; 
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.8);
            color: #ffffff;
            outline: none;
        }

        .btn {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: black;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }

        /* ⚡ جاز کیش اور ایزی پیسہ بٹنز رو */
        .apps-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            width: 100%;
            box-sizing: border-box;
        }

        .app-btn {
            flex: 1;
            padding: 12px 5px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
            white-space: nowrap;
        }

        .jazzcash { background: linear-gradient(135deg, #111111, #ffcc00); color: #ffffff; border: 1px solid #ffcc00; }
        .easypaisa { background: linear-gradient(135deg, #00a651, #00713d); }
        
        .balance-text-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .balance-amount {
            font-size: 22px;
            font-weight: bold;
            color: #ffd700;
            margin-top: 5px;
        }

        .eye-btn {
            cursor: pointer;
            font-size: 18px;
            background: rgba(255,255,255,0.2);
            padding: 2px 8px;
            border-radius: 6px;
            user-select: none;
        }

        .edit-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            font-weight: bold;
        }

        .notes-title {
            text-align: right;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #ffd700;
        }

        .notes-area {
            width: 100%;
            height: 80px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 13px;
            outline: none;
        }

        #backup-login, #dashboard { display: none; }
    </style>
</head>
<body class="login-bg">

<!-- نام کا ہیڈر اب کنٹینر سے باہر ہے تاکہ یہ بائیں طرف کھل کر اچھے سے ایڈجسٹ ہو سکے -->
<div class="vip-header">Sahibzada Umer Siraj</div>

<div class="container">
    <!-- 1. لاگ ان اسکرین -->
    <div id="backup-login" class="glass-button-card login-margin-box">
        <div style="font-size: 26px; margin-bottom: 6px;">🔒</div>
        <p style="color: #e2e8f0; font-size: 12px; margin-bottom: 10px;">والٹ انلاک کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="پن کوڈ درج کریں" maxlength="4">
        <button class="btn" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 2. مین ڈیش بورڈ -->
    <div id="dashboard">
        <!-- بیلنس کارڈ -->
        <div class="glass-button-card">
            <div class="balance-text-group">
                <div style="font-size: 13px; opacity: 0.9;">کل بیلنس (PKR):</div>
                <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            </div>
            <div id="balance-val" class="balance-amount">Rs. 0</div>
            <button class="edit-btn" onclick="editBalance()">رقم تبدیل کریں ✏️</button>
        </div>

        <!-- بٹنز رو -->
        <div class="apps-row">
            <a href="jazzcash://" class="app-btn jazzcash">JazzCash</a>
            <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa</a>
        </div>

        <!-- خفیہ نوٹس کارڈ -->
        <div class="glass-button-card">
            <div class="notes-title">📝 میرے خفیہ نوٹس:</div>
            <textarea id="wallet-notes" class="notes-area" placeholder="کارڈ نمبرز یا کوڈز یہاں لکھیں..." oninput="saveNotes()"></textarea>
        </div>
    </div>
</div>

<script>
    var CORRECT_USER = "UmerSiraj";
    var CORRECT_PIN = "1122";
    var isBalanceHidden = false;

    // جیسے ہی پیج لوڈ ہو، یقینی بنائیں کہ لاگ ان فارم نظر آئے اور ڈیش بورڈ چھپا رہے
    window.onload = function() {
        document.getElementById('backup-login').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.body.className = "login-bg";

        var savedBalance = localStorage.getItem('wallet_balance');
        if (savedBalance) {
            document.getElementById('balance-val').innerText = "Rs. " + savedBalance;
        }

        if (localStorage.getItem('wallet_notes')) {
            document.getElementById('wallet-notes').value = localStorage.getItem('wallet_notes');
        }
    };

    // لاگ ان ویریفیکیشن
    function verifyBackupLogin() {
        var user = document.getElementById('login-user').value;
        var pin = document.getElementById('login-pin').value;

        if (user === CORRECT_USER && pin === CORRECT_PIN) {
            document.getElementById('backup-login').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.body.className = "dashboard-bg";
        } else {
            alert("غلط یوزر نیم یا پن کوڈ درج کیا گیا ہے!");
        }
    }

    // بیلنس شو / ہائیڈ
    function toggleBalance() {
        var balanceElement = document.getElementById('balance-val');
        if (!isBalanceHidden) {
            var currentBalance = balanceElement.innerText.replace("Rs. ", "");
            localStorage.setItem('temp_balance', currentBalance);
            balanceElement.innerText = "Rs. *****";
            isBalanceHidden = true;
        } else {
            var saved = localStorage.getItem('wallet_balance') || "0";
            balanceElement.innerText = "Rs. " + saved;
            isBalanceHidden = false;
        }
    }

    // بیلنس ایڈٹ کرنا
    function editBalance() {
        var newBalance = prompt("نئی رقم درج کریں:");
        if (newBalance !== null && !isNaN(newBalance) && newBalance.trim() !== "") {
            localStorage.setItem('wallet_balance', newBalance);
            document.getElementById('balance-val').innerText = "Rs. " + newBalance;
            isBalanceHidden = false;
        }
    }

    // نوٹس سیو کرنا
    function saveNotes() {
