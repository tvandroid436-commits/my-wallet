<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میرا محفوظ والٹ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .app-btn {
            display: block;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .jazzcash { background: #000000; color: #ffcc00; border: 1px solid #ffcc00; }
        .easypaisa { background: #00a651; }
        
        /* نیو فیچرز کی اسٹائلنگ */
        .balance-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            text-align: right;
            position: relative;
        }
        .balance-amount {
            font-size: 26px;
            font-weight: bold;
            margin-top: 5px;
        }
        .eye-btn {
            position: absolute;
            left: 20px;
            top: 20px;
            cursor: pointer;
            font-size: 20px;
        }
        .edit-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }
        .notes-section {
            margin-top: 25px;
            text-align: right;
        }
        .notes-area {
            width: 100%;
            height: 90px;
            background: #fdfdfd;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 10px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
            margin-top: 5px;
        }

        #setup-screen, #lock-screen, #backup-login, #dashboard { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. سیٹ اپ اسکرین -->
    <div id="setup-screen">
        <h2>والٹ سیٹ اپ کریں</h2>
        <p>پہلی بار لاگ ان کے لیے اپنا یوزر نیم اور پن کوڈ بنائیں۔</p>
        <input type="text" id="setup-user" class="input-field" placeholder="یوزر نیم لکھیں">
        <input type="password" id="setup-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="saveSetup()">سیکیورٹی لاک سیٹ کریں</button>
    </div>

    <!-- 2. فنگر پرنٹ لاک اسکرین -->
    <div id="lock-screen">
        <div style="font-size: 60px; margin-bottom: 15px;">🛡️</div>
        <h2>میرا محفوظ والٹ</h2>
        <p>والٹ کھولنے کے لیے نیچے بٹن دبا کر اپنا فنگر پرنٹ لگائیں۔</p>
        <button class="btn" onclick="authenticateUser()">فنگر پرنٹ سے انلاک کریں</button>
    </div>

    <!-- 3. پن کوڈ لاگ ان اسکرین -->
    <div id="backup-login">
        <div style="font-size: 50px; margin-bottom: 15px;">🔒</div>
        <h2>والٹ لاگ ان</h2>
        <p>براہ کرم اپنا صحیح یوزر نیم اور پن کوڈ درج کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 4. مین ڈیش بورڈ (نئے فیچرز کے ساتھ) -->
    <div id="dashboard">
        <div class="balance-card">
            <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            <div style="font-size: 12px; opacity: 0.8;">میرا کل بیلنس (PKR)</div>
            <div id="balance-val" class="balance-amount">Rs. 0</div>
            <button class="edit-btn" onclick="editBalance()">رقم تبدیل کریں ✏️</button>
        </div>

        <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
        <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>

        <!-- خفیہ نوٹس سیکشن -->
        <div class="notes-section">
            <label style="font-size: 14px; font-weight: bold;">📝 میرے خفیہ نوٹس / اکاؤنٹس:</label>
            <textarea id="wallet-notes" class="notes-area" placeholder="اپنے ضروری کارڈ نمبرز یا کوڈز یہاں لکھیں، یہ خود بخود محفوظ رہیں گے..." oninput="saveNotes()"></textarea>
        </div>
    </div>

</div>

<script>
    var isBalanceHidden = false;

    window.onload = function() {
        var savedUser = localStorage.getItem('secure_user');
        var savedPin = localStorage.getItem('secure_pin');

        if (!savedUser || !savedPin) {
            document.getElementById('setup-screen').style.display = 'block';
        } else {
            if (window.PublicKeyCredential) {
                document.getElementById('lock-screen').style.display = 'block';
                authenticateUser();
            } else {
                document.getElementById('backup-login').style.display = 'block';
            }
        }

        // بیلنس لوڈ کریں
        var savedBalance = localStorage.getItem('wallet_balance');
        if (savedBalance) {
            document.getElementById('balance-val').innerText = "Rs. " + savedBalance;
        } else {
            document.getElementById('balance-val').innerText = "Rs. 0";
        }

        // نوٹس لوڈ کریں
        if (localStorage.getItem('wallet_notes')) {
            document.getElementById('wallet-notes').value = localStorage.getItem('wallet_notes');
        }
    };

    // بیلنس بدلنے کا فنکشن
    function editBalance() {
        var newBal = prompt("نیا بیلنس درج کریں (صرف ہندسے):");
        if (newBal !== null && newBal.trim() !== "" && !isNaN(newBal)) {
            localStorage.setItem('wallet_balance', newBal);
            document.getElementById('balance-val').innerText = "Rs. " + newBal;
            isBalanceHidden = false;
        }
    }

    // بیلنس چھپانے کا فنکشن
    function toggleBalance() {
        var balElement = document.getElementById('balance-val');
        var currentSaved = localStorage.getItem('wallet_balance') || "0";
        if (isBalanceHidden) {
            balElement.innerText = "Rs. " + currentSaved;
            isBalanceHidden = false;
        } else {
            balElement.innerText = "******";
            isBalanceHidden = true;
        }
    }

    // نوٹس سیو کرنے کا فنکشن
    function saveNotes() {
        localStorage.setItem('wallet_notes', document.getElementById('wallet-notes').value);
    }

    function saveSetup() {
        var u = document.getElementById('setup-user').value.trim();
        var p = document.getElementById('setup-pin').value.trim();
        if (u === "" || p.length !== 4 || isNaN(p)) {
            alert("❌ درست معلومات لکھیں!");
            return;
        }
        localStorage.setItem('secure_user', u);
        localStorage.setItem('secure_pin', p);
        alert("✅ سیکیورٹی لاک سیٹ ہو گیا!");
        window.location.reload();
    }

    function authenticateUser() {
        if (!window.PublicKeyCredential) { showBackupScreen(); return; }
        navigator.credentials.create({
            publicKey: {
                challenge: new Uint8Array(),
                rp: { name: "Wallet" },
                user: { id: new Uint8Array(), name: localStorage.getItem('secure_user') || "user", displayName: "Owner" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                timeout: 60000,
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
            }
        }).then(function(credential) {
            if (credential) { showDashboard(); } else { showBackupScreen(); }
        }).catch(function(err) { showBackupScreen(); });
    }

    function showBackupScreen() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('backup-login').style.display = 'block';
    }

    function verifyBackupLogin() {
        var u = document.getElementById('login-user').value.trim();
        var p = document.getElementById('login-pin').value.trim();
        if (u === localStorage.getItem('secure_user') && p === localStorage.getItem('secure_pin')) {
            showDashboard();
        } else { alert("❌ غلط معلومات!"); }
    }

    function showDashboard() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('backup-login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
    }
</script>

</body>
</html>
