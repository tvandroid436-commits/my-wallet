<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>میرا محفوظ والٹ</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f7fa;
            color: #2c3e50;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 40px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .input-field {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
        }
        .btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
        .app-btn {
            display: block;
            padding: 15px;
            margin-bottom: 12px;
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }
        .jazzcash { background: #000000; color: #ffcc00; border: 1px solid #ffcc00; }
        .easypaisa { background: #00a651; }
        
        /* شروعات میں سب اسکرینز چھپی ہوں گی، جاوا اسکرپٹ فیصلہ کرے گی کون سی دکھانی ہے */
        #setup-screen, #lock-screen, #backup-login, #dashboard { display: none; }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. پہلی بار سیٹ اپ اسکرین -->
    <div id="setup-screen">
        <h2>والٹ سیٹ اپ کریں</h2>
        <p>پہلی بار لاگ ان کے لیے اپنا یوزر نیم اور پن کوڈ بنائیں۔</p>
        <input type="text" id="setup-user" class="input-field" placeholder="یوزر نیم لکھیں">
        <input type="password" id="setup-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="saveSetup()">سیکیورٹی لاک سیٹ کریں</button>
    </div>

    <!-- 2. فنگر پرنٹ لاک اسکرین (کروم کے لیے) -->
    <div id="lock-screen">
        <div style="font-size: 60px; margin-bottom: 15px;">🛡️</div>
        <h2>میرا محفوظ والٹ</h2>
        <p>والٹ کھولنے کے لیے نیچے بٹن دبا کر اپنا فنگر پرنٹ لگائیں۔</p>
        <button class="btn" onclick="authenticateUser()">فنگر پرنٹ سے انلاک کریں</button>
    </div>

    <!-- 3. پن کوڈ لاگ ان اسکرین (بیک اپ اور دوسرے موبائلز کے لیے) -->
    <div id="backup-login">
        <div style="font-size: 50px; margin-bottom: 15px;">🔒</div>
        <h2>والٹ لاگ ان</h2>
        <p>براہ کرم اپنا صحیح یوزر نیم اور پن کوڈ درج کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 4. مین ڈیش بورڈ -->
    <div id="dashboard">
        <h2>خوش آمدید!</h2>
        <div style="background: #764ba2; color:white; padding:15px; border-radius:10px; margin-bottom:20px;">
            <h3>Rs. 50,000</h3>
        </div>
        <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
        <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>
    </div>

</div>

<script>
    window.onload = function() {
        var savedUser = localStorage.getItem('secure_user');
        var savedPin = localStorage.getItem('secure_pin');

        // اگر ابھی تک یوزر نیم اور پن سیٹ نہیں ہوا
        if (!savedUser || !savedPin) {
            document.getElementById('setup-screen').style.display = 'block';
        } else {
            // اگر براؤزر فنگر پرنٹ کو سپورٹ کرتا ہے (جیسے کروم)
            if (window.PublicKeyCredential) {
                document.getElementById('lock-screen').style.display = 'block';
                authenticateUser(); // آٹو فنگر پرنٹ کھولیں
            } else {
                // اگر یو سی براؤزر یا کوئی ایسا موبائل ہے جو سپورٹ نہیں کرتا
                document.getElementById('backup-login').style.display = 'block';
            }
        }
    };

    // پہلی بار سیٹ اپ سیو کرنے کا فنکشن
    function saveSetup() {
        var u = document.getElementById('setup-user').value.trim();
        var p = document.getElementById('setup-pin').value.trim();

        if (u === "" || p.length !== 4 || isNaN(p)) {
            alert("❌ براہ کرم درست یوزر نیم اور 4 ہندسوں کا پن کوڈ لکھیں!");
            return;
        }

        localStorage.setItem('secure_user', u);
        localStorage.setItem('secure_pin', p);
        alert("✅ سیکیورٹی لاک کامیابی سے سیٹ ہو گیا ہے!");
        window.location.reload();
    }

    // فنگر پرنٹ بائیومیٹرک کا فنکشن
    function authenticateUser() {
        if (!window.PublicKeyCredential) {
            showBackupScreen();
            return;
        }

        navigator.credentials.create({
            publicKey: {
                challenge: new Uint8Array(),
                rp: { name: "Wallet" },
                user: { id: new Uint8Array(), name: localStorage.getItem('secure_user') || "user", displayName: "Owner" },
                pubKeyCredParams: [{ type: "public-key", alg: -7 }],
                timeout: 60000,
                authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" }
            }
        }).then(function(credential) {
            if (credential) { 
                showDashboard(); 
            } else {
                showBackupScreen();
            }
        }).catch(function(err) {
            // سیکیورٹی فکس: اگر فنگر پرنٹ فیل ہو، کینسل ہو، یا دوسرا موبائل ہو تو سیدھا پاس ورڈ مانگے گا
            showBackupScreen();
        });
    }

    function showBackupScreen() {
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('backup-login').style.display = 'block';
    }

    // یوزر نیم اور پن کوڈ چیک کرنے کا فنکشن
    function verifyBackupLogin() {
        var enteredUser = document.getElementById('login-user').value.trim();
        var enteredPin = document.getElementById('login-pin').value.trim();
        
        var savedUser = localStorage.getItem('secure_user');
        var savedPin = localStorage.getItem('secure_pin');

        if (enteredUser === savedUser && enteredPin === savedPin) {
            showDashboard();
        } else {
            alert("❌ غلط یوزر نیم یا پن کوڈ! دوبارہ کوشش کریں۔");
        }
    }

    function showDashboard() {
        document.getElementById('setup-screen').style.display = 'none';
        document.getElementById('lock-screen').style.display = 'none';
        document.getElementById('backup-login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
    }
</script>

</body>
</html>
