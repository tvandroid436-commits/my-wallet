<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صاحبزادہ عمر سراج والٹ</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            padding: 20px;
            text-align: center;
            margin: 0;
            min-height: 100vh;
            background-size: cover !important;
            background-position: center center !important;
            background-repeat: no-repeat !important;
            background-attachment: fixed !important;
            background-color: #0f172a;
            box-sizing: border-box;
        }
        
        /* 🖼️ بیک گراؤنڈ تصاویر */
        body.login-bg { background: url('pic1.jpg'); }
        body.dashboard-bg { background: url('pic2.jpg'); }

        /* وی آئی پی نام کی اسٹائلینگ */
        .vip-header {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0 30px 0;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.6), 0 0 20px rgba(255, 255, 255, 0.4);
            background: linear-gradient(135deg, #ffffff 0%, #ffd700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        .container {
            max-width: 380px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* تمام کارڈز کو بٹن اور شیشے (Glassmorphism) کی شکل دے دی ہے */
        .glass-button-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            margin-bottom: 15px;
            text-align: center;
        }

        .input-field {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
            font-size: 16px;
            background: rgba(0, 0, 0, 0.4);
            color: #ffffff;
            outline: none;
        }
        .input-field::placeholder { color: #cbd5e1; opacity: 0.8; }

        .btn {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s;
        }
        .btn:active { transform: scale(0.98); }

        .app-btn {
            display: block;
            padding: 16px;
            border-radius: 16px;
            text-decoration: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .app-btn:active { transform: scale(0.98); }

        .jazzcash { background: linear-gradient(135deg, #111111, #ffcc00); color: #ffffff; border: 1px solid #ffcc00; }
        .easypaisa { background: linear-gradient(135deg, #00a651, #00713d); }
        
        .balance-text-group {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 10px;
        }

        .balance-amount {
            font-size: 26px;
            font-weight: bold;
            color: #ffd700;
        }

        .eye-btn {
            cursor: pointer;
            font-size: 22px;
            background: rgba(255,255,255,0.2);
            padding: 4px 10px;
            border-radius: 8px;
            user-select: none;
        }

        .edit-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-weight: bold;
        }

        .notes-title {
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #ffd700;
        }

        .notes-area {
            width: 100%;
            height: 90px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            border-radius: 12px;
            padding: 12px;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
            outline: none;
        }

        #backup-login, #dashboard { display: none; }
    </style>
</head>
<body class="login-bg">

<div class="container">
    <!-- شاہی ہیڈر جو ہمیشہ اوپر رہے گا -->
    <div class="vip-header">صاحبزادہ عمر سراج</div>

    <!-- 1. لاگ ان اسکرین (بٹن اور شیشے کے لک میں فکس) -->
    <div id="backup-login" class="glass-button-card">
        <div style="font-size: 40px; margin-bottom: 10px;">🔒</div>
        <p style="color: #e2e8f0; font-size: 14px; margin-bottom: 15px;">والٹ انلاک کرنے کے لیے لاگ ان کریں۔</p>
        <input type="text" id="login-user" class="input-field" placeholder="یوزر نیم درج کریں">
        <input type="password" id="login-pin" class="input-field" placeholder="4 ہندسوں کا پن کوڈ" maxlength="4">
        <button class="btn" onclick="verifyBackupLogin()">لاگ ان کریں</button>
    </div>

    <!-- 2. مین ڈیش بورڈ (علیحدہ الگ الگ پٹیاں/بٹنز) -->
    <div id="dashboard">
        
        <!-- بیلنس بٹن کارڈ -->
        <div class="glass-button-card">
            <div class="balance-text-group">
                <div style="font-size: 14px; opacity: 0.9;">میرا کل بیلنس (PKR):</div>
                <div class="eye-btn" onclick="toggleBalance()">👁️</div>
            </div>
            <div id="balance-val" class="balance-amount">Rs. 0</div>
            <button class="edit-btn" onclick="editBalance()">رقم تبدیل کریں ✏️</button>
        </div>

        <!-- ایپس کے لنکس (علیحدہ الگ بٹنز) -->
        <a href="jazzcash://" class="app-btn jazzcash">JazzCash کھولیں</a>
        <a href="easypaisa://" class="app-btn easypaisa">EasyPaisa کھولیں</a>

        <!-- خفیہ نوٹس بٹن کارڈ -->
        <div class="glass-button-card">
            <div class="notes-title">📝 میرے خفیہ نوٹس / اکاؤنٹس:</div>
            <textarea id="wallet-notes" class="notes-area" placeholder="اپنے ضروری کارڈ نمبرز یا کوڈز یہاں لکھیں..." oninput="saveNotes()"></textarea>
        </div>
        
    </div>
</div>

<script>
    // یوزر نیم اور پاس ورڈ فکسڈ ڈیٹا
    var CORRECT_USER = "UmerSiraj";
    var CORRECT_PIN = "1122";
    var isBalanceHidden = false;

    window.onload = function() {
        // سیدھا لاگ ان اسکرین دکھائیں
        document.getElementById('backup-login').style.display = 'block';

        // محفوظ شدہ بیلنس لوڈ کریں
        var savedBalance = localStorage.getItem('wallet_balance');
        if (savedBalance) {
            document.getElementById('balance-val').innerText = "Rs. " + savedBalance;
        }

        // محفوظ شدہ نوٹس لوڈ کریں
        if (localStorage.getItem('wallet_notes')) {
            document.getElementById('wallet-notes').value = localStorage.getItem('wallet_notes');
        }
    };

    // لاگ ان کی تصدیق کا فنکشن
    function verifyBackupLogin() {
        var enteredUser = document.getElementById('login-user').value.trim();
        var enteredPin = document.getElementById('login-pin').value.trim();

        if (enteredUser === CORRECT_USER && enteredPin === CORRECT_PIN) {
            showDashboard();
        } else {
            alert("❌ غلط یوزر نیم یا پن کوڈ! دوبارہ کوشش کریں۔");
        }
    }

    function toggleBalance() {
        var balElement = document.getElementById('balance-val');
        var currentSaved = localStorage.getItem('wallet_balance') || "0";
        
        if (isBalanceHidden) {
            balElement.innerText = "Rs. " + currentSaved;
            isBalanceHidden = false;
        } else {
            balElement.innerText = "******";
            isBalanceHidden = true;
        }
    }

    function editBalance() {
        var newBal = prompt("نیا بیلنس درج کریں (صرف ہندسے):");
        if (newBal !== null && newBal.trim() !== "" && !isNaN(newBal)) {
            localStorage.setItem('wallet_balance', newBal);
            document.getElementById('balance-val').innerText = "Rs. " + newBal;
            isBalanceHidden = false;
        }
    }

    function saveNotes() {
        localStorage.setItem('wallet_notes', document.getElementById('wallet-notes').value);
    }

    function showDashboard() {
        document.getElementById('backup-login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'block';
        
        // ڈیش بورڈ کھلتے ہی بیک گراؤنڈ کلاس تبدیل کریں
        document.body.className = "dashboard-bg";
    }
</script>

</body>
</html>
